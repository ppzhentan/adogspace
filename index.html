<style>
  :root {
    --bg-0: #05060d;
    --bg-1: #0b0d1a;
    --fg:   #f4f1e8;
    --dim:  #a6a8b8;
    --faint:#5a5d72;
    --accent: #ff9a3c;   /* rocket flame / mars warm */
    --mars:   #c84a1e;
    --moon:   #d8d2c2;
    --blue:   #4a7cff;
    --line:   rgba(255,255,255,0.08);
  }
  [data-palette="mars"] {
    --bg-0: #140806; --bg-1: #1f0c07;
    --accent: #ff5e2b;
  }
  [data-palette="mono"] {
    --bg-0: #000; --bg-1: #0a0a0a;
    --accent: #f4f1e8; --mars: #bbb; --moon: #eee; --blue: #aaa;
  }
  [data-palette="ice"] {
    --bg-0: #030712; --bg-1: #081228;
    --accent: #7cc4ff; --mars: #5c8dff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg-0);
    color: var(--fg);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  .stage { position: relative; width: 100vw; height: 100vh; overflow: hidden; }

  /* starfield canvas */
  #stars {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    z-index: 1;
  }

  /* nebula glow */
  .nebula {
    position: absolute; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse 60% 45% at 20% 80%, rgba(255, 90, 50, 0.18), transparent 60%),
      radial-gradient(ellipse 50% 40% at 85% 15%, rgba(100, 130, 255, 0.15), transparent 65%),
      radial-gradient(ellipse 80% 60% at 50% 110%, rgba(180, 70, 40, 0.25), transparent 70%),
      linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%);
  }

  /* ───────── wordmark ───────── */
  .wordmark {
    position: absolute;
    top: 32px; left: 40px;
    z-index: 30;
    font-weight: 500;
    font-size: 16px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--fg);
  }
  .wordmark .dot { color: var(--accent); }

  .corner-r {
    position: absolute;
    top: 32px; right: 40px;
    z-index: 30;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.25em;
    color: var(--faint);
    text-transform: uppercase;
    display: flex; gap: 20px; align-items: center;
  }
  .corner-r .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: 0.3; } }

  /* centered headline */
  .hero-title {
    position: absolute;
    left: 50%; bottom: 10%;
    transform: translateX(-50%);
    z-index: 30;
    font-weight: 300;
    font-size: clamp(80px, 16vw, 240px);
    letter-spacing: -0.05em;
    line-height: 0.9;
    color: var(--fg);
    text-align: center;
    white-space: nowrap;
    pointer-events: none;
    mix-blend-mode: screen;
  }
  .hero-title .dot { color: var(--accent); }
  .hero-title .space {
    color: var(--dim);
    font-weight: 300;
  }

  .tagline {
    position: absolute;
    left: 50%; top: 32px;
    transform: translateX(-50%);
    z-index: 30;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--dim);
  }

  /* ───────── SCENE ──────────── */
  .scene {
    position: absolute; inset: 0;
    z-index: 10;
  }

  /* planets */
  .planet {
    position: absolute;
    border-radius: 50%;
    filter: drop-shadow(0 0 40px rgba(0,0,0,0.6));
  }

  /* MARS — bottom right, big (texture replaced) */
  .mars {
    right: -8%;
    bottom: -22%;
    width: 640px; height: 640px;
    background:
      radial-gradient(circle at 28% 24%, #ffc58f 0%, #f58c58 18%, #c85622 46%, #6d220d 78%, #1e0705 100%);
    box-shadow:
      inset -30px -40px 120px rgba(0,0,0,0.55),
      inset 30px 30px 80px rgba(255,140,80,0.15),
      0 0 80px rgba(255,80,30,0.15);
    overflow: hidden;
    isolation: isolate;
    animation: float-a 14s ease-in-out infinite;
  }
  .mars::before, .mars::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
  }
  .mars::before {
    background:
      radial-gradient(circle at 24% 20%, rgba(255, 230, 190, 0.18), transparent 24%),
      radial-gradient(circle at 68% 66%, transparent 48%, rgba(0,0,0,0.3) 72%, rgba(0,0,0,0.56) 100%);
    z-index: 2;
    pointer-events: none;
  }
  .mars::after {
    background:
      radial-gradient(circle at 28% 24%, rgba(255, 243, 210, 0.32), transparent 28%),
      url('./assets/mars.png') center 48% / 132% 132% no-repeat;
    opacity: 0.9;
    filter: saturate(0.95) contrast(1.08) brightness(1.02);
  }

  /* MOON — top left (texture replaced) */
  .moon {
    left: 6%;
    top: 14%;
    width: 180px; height: 180px;
    background:
      radial-gradient(circle at 30% 28%, #fffdf7 0%, #d7d1c2 42%, #86806f 76%, #4b463c 100%);
    box-shadow:
      inset -15px -20px 50px rgba(0,0,0,0.45),
      0 0 60px rgba(216, 210, 194, 0.2);
    overflow: hidden;
    isolation: isolate;
    animation: float-b 11s ease-in-out infinite;
  }
  .moon::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background:
      radial-gradient(circle at 28% 24%, rgba(255,255,255,0.08), transparent 22%),
      radial-gradient(circle at 70% 70%, transparent 46%, rgba(0,0,0,0.22) 70%, rgba(0,0,0,0.42) 100%);
    z-index: 2;
    pointer-events: none;
  }
  .moon::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: url('./assets/moon.png') center / 138% 138% no-repeat;
    opacity: 0.97;
    filter: saturate(0.88) contrast(1.28) brightness(0.92);
  }

  /* small distant planet (texture replaced) */
  .earthling {
    position: absolute;
    right: 14%; top: 22%;
    width: 60px; height: 60px;
    border-radius: 50%;
    overflow: hidden;
    background: #03050a;
    box-shadow: inset -6px -8px 20px rgba(0,0,0,0.5);
    animation: float-c 9s ease-in-out infinite;
  }
  .earthling::before {
    content: "";
    position: absolute;
    inset: -4px;
    border-radius: inherit;
    background: url('./assets/earth.png') center / 112% 112% no-repeat;
  }

  @keyframes float-a { 50% { transform: translateY(-14px); } }
  @keyframes float-b { 50% { transform: translateY(10px); } }
  @keyframes float-c { 50% { transform: translateY(-8px) translateX(6px); } }

  /* ───────── ROCKET ───────── */
  .rocket-wrap {
    position: absolute;
    left: 86%;
    top: 22%;
    z-index: 15;
    width: 120px; height: 340px;
    transform: translate(-50%, -60%) rotate(-54deg);
    animation: rocket-drift 4s ease-in-out infinite;
  }
  [data-launch="true"] .rocket-wrap { animation: rocket-launch 12s linear infinite; }

  @keyframes rocket-drift {
    0%, 100% { left: 86%; top: 22%; transform: translate(-50%, -60%) rotate(-54deg); }
    50% { left: 86%; top: 22%; transform: translate(-50%, calc(-60% - 6px)) rotate(-54deg); }
  }

  /* 沿 C 形 trail 按等旋转角采样的关键帧:
     - 弯底(高曲率)区域帧密,直线段稀疏 —— 相邻帧旋转差 ≤6°, 消除转弯抖动
     - 但每帧的时间 (%) 仍按弧长比例 —— 视觉速度保持匀速
     - scale 从 0.28 线性增长到 1.35, 制造从远到近的放大 */
  @keyframes rocket-launch {
    0%     { left: 86.00%; top: 22.00%; transform: translate(-50%,-60%) rotate(-64.26deg) scale(0.280); opacity: 0; }

    29.20% { left:  24.60%; top: 11.05%; transform: translate(-50%,-60%) rotate(-105.81deg) scale(0.625); opacity: 1; }
    30.56% { left:  21.06%; top: 12.25%; transform: translate(-50%,-60%) rotate(-111.75deg) scale(0.645); opacity: 1; }
    31.72% { left:  18.16%; top: 13.58%; transform: translate(-50%,-60%) rotate(-117.68deg) scale(0.662); opacity: 1; }

    88%    { left: 83.00%; top: 88.00%; transform: translate(-50%,-60%) rotate(-266.01deg) scale(1.350); opacity: 0; }
    100%   { left: 86.00%; top: 22.00%; transform: translate(-50%,-60%) rotate(-64.26deg) scale(0.280); opacity: 0; }
  }

  .rocket {
    position: relative;
    width: 100%; height: 220px;
  }

  /* nose cone */
  .nose {
    position: absolute;
    left: 50%; top: 0;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 26px solid transparent;
    border-right: 26px solid transparent;
    border-bottom: 58px solid var(--fg);
    filter: drop-shadow(0 0 18px rgba(255,255,255,0.15));
  }
  .nose::after {
    content: "";
    position: absolute;
    left: -4px; top: 30px;
    width: 8px; height: 8px;
    background: var(--accent);
    border-radius: 50%;
  }

  /* body */
  .body {
    position: absolute;
    left: 50%; top: 52px;
    transform: translateX(-50%);
    width: 52px; height: 150px;
    background: linear-gradient(90deg, #c8c4b8 0%, #f4f1e8 30%, #fff 45%, #e6e2d4 75%, #8f8b7e 100%);
    border-radius: 6px 6px 2px 2px;
  }
  .body::before {
    /* window */
    content: "";
    position: absolute;
    left: 50%; top: 22px;
    transform: translateX(-50%);
    width: 28px; height: 28px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #b0d8ff 0%, #4a7cff 60%, #1a2e66 100%);
    border: 3px solid #2a2a32;
    box-shadow: inset 0 0 6px rgba(0,0,0,0.5);
  }
  .body .window-dog {
    /* empty cockpit window (dog floats outside) */
    position: absolute;
    left: 50%; top: 22px;
    transform: translateX(-50%);
    width: 26px; height: 26px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #b8dcff 0%, #3a6cdc 55%, #0e1a4a 100%);
    box-shadow: inset -3px -4px 8px rgba(0,0,0,0.5), inset 4px 4px 8px rgba(255,255,255,0.2);
    z-index: 2;
  }
  .body .window-dog svg { display: none; }

  /* stripe band */
  .band {
    position: absolute;
    left: 50%; top: 120px;
    transform: translateX(-50%);
    width: 52px; height: 18px;
    background: var(--accent);
    z-index: 1;
    display: grid;
    place-items: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: #2a1a00;
  }
  .band span { transform: translateY(0); }

  /* fins */
  .fin {
    position: absolute;
    bottom: 8px;
    width: 0; height: 0;
  }
  .fin.l {
    left: calc(50% - 52px);
    border-bottom: 50px solid #8f8b7e;
    border-right: 28px solid transparent;
  }
  .fin.r {
    right: calc(50% - 52px);
    border-bottom: 50px solid #8f8b7e;
    border-left: 28px solid transparent;
  }

  /* nozzle */
  .nozzle {
    position: absolute;
    left: 50%; bottom: 0;
    transform: translateX(-50%);
    width: 38px; height: 18px;
    background: linear-gradient(180deg, #4a4a52 0%, #1a1a22 100%);
    border-radius: 2px 2px 6px 6px;
    z-index: 2;
  }

  /* FLAME */
  .flame {
    position: absolute;
    left: 50%; top: 218px;
    transform: translateX(-50%);
    width: 44px; height: 110px;
    z-index: 0;
  }
  .flame .f1, .flame .f2, .flame .f3 {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    border-radius: 50% 50% 40% 40% / 30% 30% 70% 70%;
    filter: blur(2px);
    mix-blend-mode: screen;
  }
  .flame .f1 {
    top: 0; width: 44px; height: 100px;
    background: radial-gradient(ellipse at 50% 20%, #fff 0%, #ffd57a 30%, #ff9a3c 55%, transparent 80%);
    animation: flicker 0.12s ease-in-out infinite alternate;
  }
  .flame .f2 {
    top: 10px; width: 28px; height: 80px;
    background: radial-gradient(ellipse at 50% 20%, #fff 0%, #ffecc2 40%, #ff6a20 75%, transparent);
    animation: flicker 0.09s ease-in-out infinite alternate-reverse;
  }
  .flame .f3 {
    top: 22px; width: 16px; height: 56px;
    background: radial-gradient(ellipse at 50% 20%, #fff 0%, #cfe8ff 70%, transparent);
    animation: flicker 0.07s ease-in-out infinite alternate;
  }
  @keyframes flicker {
    from { transform: translateX(-50%) scale(1, 1); }
    to { transform: translateX(-50%) scale(1.1, 0.9); }
  }

  /* smoke puffs at base */
  .smoke {
    position: absolute;
    left: 50%; bottom: -30px;
    transform: translateX(-50%);
    width: 300px; height: 120px;
    z-index: 14;
    pointer-events: none;
  }
  .puff {
    position: absolute;
    width: 80px; height: 80px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,220,190,0.35) 0%, rgba(200,160,130,0.15) 40%, transparent 70%);
    filter: blur(6px);
    animation: puff 3s ease-out infinite;
  }
  .puff:nth-child(1) { left: 20%; animation-delay: 0s; }
  .puff:nth-child(2) { left: 55%; animation-delay: 0.5s; width: 100px; height: 100px; }
  .puff:nth-child(3) { left: 35%; animation-delay: 1s; width: 120px; height: 120px; }
  .puff:nth-child(4) { left: 70%; animation-delay: 1.5s; }
  .puff:nth-child(5) { left: 10%; animation-delay: 2s; }
  @keyframes puff {
    0% { transform: translateY(0) scale(0.4); opacity: 0; }
    30% { opacity: 1; }
    100% { transform: translateY(-60px) scale(1.8); opacity: 0; }
  }

  /* ───────── SPACE-DOG FLOATING ───────── */
  .spacedog {
    position: absolute;
    left: 22%; top: 46%;
    transform: translate(-50%, -50%);
    width: 230px; height: 230px;
    z-index: 20;
    animation: drift 9s ease-in-out infinite;
  }
  .spacedog-img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
  }
  .spacedog > .helmet,
  .spacedog > .backpack {
    display: none;
  }
  @keyframes drift {
    0%   { transform: translate(-50%, -50%) rotate(-6deg); }
    33%  { transform: translate(calc(-50% + 14px), calc(-50% - 12px)) rotate(2deg); }
    66%  { transform: translate(calc(-50% - 10px), calc(-50% + 8px)) rotate(-3deg); }
    100% { transform: translate(-50%, -50%) rotate(-6deg); }
  }

  /* tether line trailing off-screen (toward rocket) */
  .tether {
    position: absolute;
    left: 20%; top: 48%;
    width: 44vw; height: 40vh;
    z-index: 18;
    pointer-events: none;
    opacity: 0.5;
  }
  .tether svg { width: 100%; height: 100%; overflow: visible; }

  .helmet {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 190px; height: 190px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 25%, rgba(255,255,255,0.4) 0%, rgba(180,210,255,0.12) 35%, rgba(40,60,120,0.06) 60%, rgba(0,0,0,0) 90%);
    border: 5px solid var(--fg);
    box-shadow:
      inset 0 0 40px rgba(120, 180, 255, 0.22),
      inset -8px -16px 50px rgba(0,0,0,0.35),
      0 0 50px rgba(255,154,60,0.25);
  }
  .helmet::before {
    /* shine */
    content: "";
    position: absolute;
    left: 20%; top: 18%;
    width: 50px; height: 70px;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(255,255,255,0.6), transparent 60%);
    transform: rotate(-20deg);
    filter: blur(2px);
  }
  .dog-astronaut {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 145px; height: 145px;
    filter: drop-shadow(0 6px 18px rgba(0,0,0,0.45));
    pointer-events: none;
  }
  .dog-astronaut svg { width: 100%; height: 100%; display: block; }

  /* life-support backpack peeking behind helmet */
  .backpack {
    position: absolute;
    left: 50%; bottom: 8px;
    transform: translateX(-50%);
    width: 108px; height: 58px;
    background: linear-gradient(180deg, #d8d4c6 0%, #9a968a 100%);
    border-radius: 10px 10px 14px 14px;
    border: 3px solid var(--fg);
    box-shadow: inset 0 -6px 10px rgba(0,0,0,0.35), 0 4px 14px rgba(0,0,0,0.4);
    z-index: 0;
  }
  .spacedog .helmet { z-index: 1; }
  .backpack::before, .backpack::after {
    content: "";
    position: absolute;
    top: 10px;
    width: 6px; height: 26px;
    background: var(--accent);
    border-radius: 2px;
    box-shadow: 0 0 8px var(--accent);
  }
  .backpack::before { left: 18px; }
  .backpack::after { right: 18px; }

  .antenna {
    position: absolute;
    left: 50%; top: -6px;
    transform: translateX(-50%);
    width: 3px; height: 36px;
    background: var(--fg);
  }
  .antenna::after {
    content: "";
    position: absolute;
    top: -8px; left: 50%;
    transform: translateX(-50%);
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 14px var(--accent);
    animation: pulse 1.5s ease-in-out infinite;
  }

  /* ───────── SCENE: PURE ORBIT just planets ───────── */
  [data-scene="planets"] .rocket-wrap,
  [data-scene="planets"] .smoke,
  [data-scene="planets"] .spacedog { display: none; }
  [data-scene="planets"] .mars { width: 780px; height: 780px; right: -15%; bottom: -30%; }

  /* trajectory arc */
  .arc {
    position: absolute;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    display: none;  /* 隐藏轨迹线 */
  }
  .arc svg { width: 100%; height: 100%; display: block; }
  .arc .trail-glow {
    fill: none;
    stroke: rgba(255, 154, 60, 0.18);
    stroke-width: 3;
    filter: blur(1px);
  }
  .arc .trail-main {
    fill: none;
    stroke: rgba(255, 154, 60, 0.28);
    stroke-width: 2.3;
    stroke-dasharray: 8 12;
  }

  /* meta strip bottom */
  .meta-strip {
    position: absolute;
    left: 40px; right: 40px;
    bottom: 32px;
    z-index: 30;
    display: flex;
    justify-content: space-between;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--faint);
    pointer-events: none;
  }
  .meta-strip .k { color: var(--faint); }
  .meta-strip .v { color: var(--dim); margin-left: 8px; }

  /* tweaks */
  .tweaks {
    position: fixed; right: 20px; bottom: 20px;
    z-index: 100;
    width: 240px;
    background: rgba(10, 10, 18, 0.92);
    backdrop-filter: blur(14px);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    display: none;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .tweaks.open { display: block; }
  .tweaks h5 {
    text-transform: uppercase;
    letter-spacing: 0.22em;
    color: var(--accent);
    font-size: 10px;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--line);
  }
  .tweaks .field { margin-bottom: 14px; }
  .tweaks label {
    display: block;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.18em;
    font-size: 9px;
    margin-bottom: 8px;
  }
  .seg-ctrl {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 1fr;
    border: 1px solid var(--line);
    border-radius: 2px;
    overflow: hidden;
  }
  .seg-ctrl button {
    background: transparent;
    color: var(--dim);
    border: none;
    border-right: 1px solid var(--line);
    padding: 8px 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
  }
  .seg-ctrl button:last-child { border-right: none; }
  .seg-ctrl button.active { background: var(--accent); color: #1a1000; }
  .seg-ctrl button:hover:not(.active) { background: rgba(255,255,255,0.05); color: var(--fg); }

  @media (max-width: 700px) {
    .wordmark, .corner-r { top: 20px; font-size: 11px; }
    .wordmark { left: 20px; } .corner-r { right: 20px; }
    .mars { width: 480px; height: 480px; right: -30%; bottom: -30%; }
    .moon { width: 110px; height: 110px; }
    .earthling { width: 36px; height: 36px; }
    .meta-strip { left: 20px; right: 20px; font-size: 8px; }
    .hero-title { font-size: 22vw; }
  }
</style>
</head>
<body data-palette="ice" data-launch="true">

<div class="stage">
  <div class="nebula"></div>
  <canvas id="stars"></canvas>

  <!-- chrome -->
  <div class="wordmark">ADOG<span class="dot">·</span>SPACE</div>
  <div class="corner-r"><span class="dot"></span><span>SIGNAL LOCK</span></div>
  <div class="tagline">A small dog, in orbit.</div>

  <!-- scene -->
  <div class="scene">
    <div class="planet moon"></div>
    <div class="planet earthling"></div>
    <div class="planet mars"></div>

    <div class="arc">
      <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <path class="trail-glow" d="M86 22 C30 -5, -5 15, 10 45 C25 75, 40 85, 83 88" />
        <path class="trail-main" d="M86 22 C30 -5, -5 15, 10 45 C25 75, 40 85, 83 88" />
      </svg>
    </div>

    <!-- tether line from dog off toward rocket -->
    <div class="tether">
      <svg viewBox="0 0 400 300" preserveAspectRatio="none">
        <path d="M0 40 Q120 180 300 260" stroke="#f4f1e8" stroke-width="1.2" stroke-dasharray="4 6" fill="none" opacity="0.8"/>
      </svg>
    </div>

    <!-- rocket -->
    <div class="rocket-wrap">
      <div class="rocket">
        <div class="nose"></div>
        <div class="body">
          <div class="window-dog">
            <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
              <!-- ear left -->
              <path d="M8 12 Q6 4 14 8 L16 18 Z" fill="#c08a5a"/>
              <path d="M9 11 Q8 6 13 9 L14 16 Z" fill="#8a5a32"/>
              <!-- ear right -->
              <path d="M32 12 Q34 4 26 8 L24 18 Z" fill="#c08a5a"/>
              <path d="M31 11 Q32 6 27 9 L26 16 Z" fill="#8a5a32"/>
              <!-- face -->
              <ellipse cx="20" cy="22" rx="12" ry="11" fill="#e8b988"/>
              <!-- snout -->
              <ellipse cx="20" cy="26" rx="7" ry="5" fill="#f5d4a8"/>
              <!-- eyes -->
              <circle cx="16" cy="20" r="1.6" fill="#1a1006"/>
              <circle cx="24" cy="20" r="1.6" fill="#1a1006"/>
              <circle cx="16.5" cy="19.5" r="0.5" fill="#fff"/>
              <circle cx="24.5" cy="19.5" r="0.5" fill="#fff"/>
              <!-- nose -->
              <ellipse cx="20" cy="25" rx="1.8" ry="1.3" fill="#1a1006"/>
              <!-- mouth -->
              <path d="M17 28 Q20 30 23 28" stroke="#1a1006" stroke-width="0.8" fill="none" stroke-linecap="round"/>
            </svg>
          </div>
        </div>
        <div class="band"><span>ADOG</span></div>
        <div class="fin l"></div>
        <div class="fin r"></div>
        <div class="nozzle"></div>
        <div class="flame">
          <div class="f1"></div>
          <div class="f2"></div>
          <div class="f3"></div>
        </div>
      </div>
      <div class="smoke">
        <div class="puff"></div>
        <div class="puff"></div>
        <div class="puff"></div>
        <div class="puff"></div>
        <div class="puff"></div>
      </div>
    </div>

    <!-- floating space-dog -->
    <div class="spacedog">
      <img src="./assets/dog.png" alt="dog" class="spacedog-img" />
    </div>
  </div>

  <!-- big title at bottom -->
  <div class="hero-title">adog<span class="dot">.</span><span class="space">space</span></div>

  <!-- bottom meta -->
  <div class="meta-strip">
    <span><span class="k">MISSION</span><span class="v">A-DOG-01</span></span>
    <span><span class="k">ORBIT</span><span class="v">LEO · 408 KM</span></span>
    <span><span class="k">CREW</span><span class="v">1 DOG</span></span>
  </div>
</div>

<!-- tweaks -->
<div class="tweaks" id="tweaks">
  <h5>▸ TWEAKS</h5>
  <div class="field">
    <label>Palette</label>
    <div class="seg-ctrl" data-key="palette">
      <button data-val="cosmic">Cosmic</button>
      <button data-val="mars">Mars</button>
      <button data-val="ice">Ice</button>
      <button data-val="mono">Mono</button>
    </div>
  </div>
  <div class="field">
    <label>Rocket launch loop</label>
    <div class="seg-ctrl" data-key="launch">
      <button data-val="true">On</button>
      <button data-val="false">Off</button>
    </div>
  </div>
</div>

<script>
  const state = { ...TWEAK_DEFAULTS };
  const body = document.body;

  function applyState() {
    body.dataset.palette = state.palette;
    body.dataset.launch = String(state.launch);
    document.querySelectorAll('.seg-ctrl').forEach(ctrl => {
      const k = ctrl.dataset.key;
      ctrl.querySelectorAll('button').forEach(b => {
        b.classList.toggle('active', String(state[k]) === b.dataset.val);
      });
    });
  }
  applyState();

  /* starfield */
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');
  let W, H, stars;
  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    stars = Array.from({ length: 260 }, () => ({
      x: Math.random() * W,
      y: Math.random() * H,
      z: Math.random() * 3 + 0.4,
      tw: Math.random() * Math.PI * 2,
    }));
  }
  resize();
  window.addEventListener('resize', resize);

  let mx = 0, my = 0;
  window.addEventListener('mousemove', e => {
    mx = (e.clientX / W - 0.5);
    my = (e.clientY / H - 0.5);
    document.querySelector('.scene').style.transform = `translate(${-mx * 10}px, ${-my * 6}px)`;
  });

  let last = performance.now();
  function tick(t) {
    const dt = t - last; last = t;
    ctx.clearRect(0, 0, W, H);
    for (const s of stars) {
      s.tw += dt * 0.0015;
      const a = 0.5 + Math.sin(s.tw) * 0.45;
      ctx.globalAlpha = a * (s.z / 3);
      ctx.fillStyle = s.z > 2.5 ? '#ffe4c0' : '#fff';
      const px = s.x - mx * s.z * 14;
      const py = s.y - my * s.z * 10;
      ctx.beginPath();
      ctx.arc(px, py, s.z * 0.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  /* tweaks wiring */
  const tweaks = document.getElementById('tweaks');
  window.addEventListener('message', (e) => {
    if (!e.data || !e.data.type) return;
    if (e.data.type === '__activate_edit_mode') tweaks.classList.add('open');
    if (e.data.type === '__deactivate_edit_mode') tweaks.classList.remove('open');
  });
  window.parent.postMessage({ type: '__edit_mode_available' }, '*');

  function persist(edits) {
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }

  document.querySelectorAll('.seg-ctrl').forEach(ctrl => {
    const key = ctrl.dataset.key;
    ctrl.querySelectorAll('button').forEach(b => {
      b.addEventListener('click', () => {
        let val = b.dataset.val;
        if (val === 'true') val = true;
        else if (val === 'false') val = false;
        state[key] = val;
        applyState();
        persist({ [key]: val });
      });
    });
  });
</script>

</body>
</html>
